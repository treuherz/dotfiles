"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Eli Treuherz"
email = "et@arenko.group"

[ui]
default-command = "ll"
diff-editor = ":builtin"
pager = ":builtin"

[ui.streampager]
interface = "quit-quickly-or-clear-output"

[merge-tools.ec]
merge-args = ["$base", "$left", "$right", "$output"]

[merge-tools.difft]
diff-args = ["--color=always", "$left", "$right"]

[merge-tools.vimdiff]
program = "nvim"
conflict-marker-style = "git"

[revsets]
bookmark-advance-to = 'closest_pushable(@)'

[aliases]
jj = ["util", "exec", "--", "jj"]
b = [ "bookmark" ]
d = [ "diff" ]
difft = [ "diff", "--tool", "difft" ]
s = [ "show" ]
e = [ "edit" ]
l = [ "log" ]
ll = [ "log", "-r", "..", "-n", "10" ]
lll = [ "log", "-T", "builtin_log_detailed"]
n = [ "new" ]
rb = [ "rebase" ]
g = [ "git" ]
gf = [ "git", "fetch" ]
gp = [ "git", "push" ]
tug = ["bookmark", "advance"]
ws = ["workspace"]

[templates]
git_push_bookmark = '"et/push-" ++ change_id.short()'

[template-aliases]
'format_short_signature(signature)' = 'signature.email().local()'

[revset-aliases]
'closest_pushable(to)' = 'heads(::to & ~description(exact:"") & (~empty() | merges()))'

[remotes.origin]
auto-track-bookmarks = "*"
